# Compile et publie l'APK signé « Kelaplus SMS ».
#  - une étiquette « v1.1.0 » poussée sur le dépôt : version signée publiée sous le nom fixe KelaplusSMS.apk, toujours au même lien :
#      https://github.com/greatfycg-png/kelaplus-sms/releases/latest/download/KelaplusSMS.apk
#  - Actions ▸ « APK Kelaplus SMS » ▸ Run workflow : compilation d'essai (signée), à télécharger dans les artefacts.
# La clé de signature est dans les secrets du dépôt (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
name: 'APK Kelaplus SMS'

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache libltdl-dev gettext

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython<3" virtualenv

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kelaplussms.keystore"

      - name: Compiler l'APK signé
        working-directory: app
        env:
          BUILDOZER_WARN_ON_ROOT: '0'
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/kelaplussms.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: buildozer -v android release

      - name: Vérifier la signature et nommer l'APK
        run: |
          APK=$(ls app/bin/*release*.apk | head -n1)
          test -n "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signature.txt
          grep -q "CN=Kelaplus SMS" signature.txt
          cp "$APK" KelaplusSMS.apk

      - name: Garder l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: KelaplusSMS-apk
          path: KelaplusSMS.apk
          if-no-files-found: error

      - name: Publier la version (lien fixe)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" KelaplusSMS.apk \
            --title "Kelaplus SMS ${GITHUB_REF_NAME#v}" \
            --notes "Application Android qui envoie les SMS de Kelaplus avec la carte SIM du téléphone de l'école. Installation : scanner le QR code dans Kelaplus (Communication ▸ Passerelles SMS directes ▸ Téléphone de l'école)." \
            --latest
